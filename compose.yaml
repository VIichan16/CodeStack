services:
    db:
        image: mysql:8.4
        ports:
            - "127.0.0.1:3307:3306"
        environment:
            MYSQL_DATABASE: codestack
            MYSQL_USER: stack
            MYSQL_PASSWORD: stack_local
            MYSQL_ROOT_PASSWORD: root_local_demo
        volumes: [dbdata:/var/lib/mysql]
        healthcheck:
            test:
                [
                    CMD-SHELL,
                    'mysql -ustack -pstack_local codestack -e "SELECT 1"',
                ]
            interval: 5s
            timeout: 5s
            retries: 30
    server:
        build: ./server
        environment:
            SESSION_SECRET: local-demo-change-me
        volumes: [media:/media]
        depends_on:
            db: { condition: service_healthy }
    nginx:
        build:
            context: .
            dockerfile: nginx/Dockerfile
        ports: ["8080:80"]
        volumes: [media:/media:ro]
        depends_on: [server]
volumes:
    dbdata:
    media:
